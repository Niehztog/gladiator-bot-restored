name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux — x86_64 (native) + 32-bit x86 (gcc-multilib -m32) + ARM cross
  # builds for Raspberry Pi: arm64/aarch64 (Pi 3/4/5 on 64-bit Pi OS) and
  # armhf (older boards / 32-bit Pi OS).  ARM targets are cross-compiled on
  # the x86_64 runner, so no dependency on GitHub-hosted ARM runners.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cc: gcc
            toolchain: ""
            yq2arch: x86_64
            archflags: ""
          - arch: x86
            cc: gcc
            toolchain: gcc-multilib
            yq2arch: i386
            archflags: "-m32"
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            toolchain: gcc-aarch64-linux-gnu
            yq2arch: aarch64
            archflags: ""
          - arch: armhf
            cc: arm-linux-gnueabihf-gcc
            toolchain: gcc-arm-linux-gnueabihf
            yq2arch: arm
            archflags: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip gcc ${{ matrix.toolchain }}

      # GLAD_SERVERFIX=1: released binaries are for people who want to PLAY, so they
      # get the deviations (see CLAUDE.md).  The repo default stays 0 -- that build is
      # the reconstruction, bugs included, and is what the ASM-matching oracles measure.
      - name: Build
        run: |
          make clean
          make \
            GLAD_SERVERFIX=1 \
            CC=${{ matrix.cc }} \
            YQ2_ARCH=${{ matrix.yq2arch }} \
            CFLAGS="${{ matrix.archflags }} -Wall -pipe -fomit-frame-pointer" \
            LDFLAGS="${{ matrix.archflags }}"

      - name: Create package
        run: |
          # Asset version: derive from the tag (v0.96 -> 096); default 096
          # for untagged push/PR builds. See Mr. Elusive's gladq2096_* scheme.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER=$(echo "${{ github.ref_name }}" | sed 's/^v//; s/\.//g')
          else
            VER=096
          fi
          PKG=gladq2${VER}_linux-${{ matrix.arch }}
          # Single flat "gladiator" mod folder: binaries + loose assets +
          # the bspc map compilers, all at top level. Only assets/default/ is
          # kept as a subfolder; assets/maps/ and the .map linker files are omitted.
          rm -rf gladiator
          mkdir -p gladiator
          cp release/gladiator.so gladiator/       2>/dev/null || true
          cp release/game/game.so gladiator/       2>/dev/null || true
          for f in assets/*; do
            [ "$f" = "assets/maps" ] && continue
            cp -r "$f" gladiator/
          done
          # tools/: ship only the Linux bspc compiler (x86 ELF — runs natively on
          # x86, and under box86 on the ARM targets)
          cp tools/vendor/bspc/bspc-linux-x86 tools/vendor/bspc/bspc-linux-x86.htm gladiator/
          tar -czf "${PKG}.tar.gz" gladiator

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: gladq2*_linux-${{ matrix.arch }}.tar.gz

  # ---------------------------------------------------------------------------
  # Windows — MinGW64 (x64) and MinGW32 (x86, the canonical reconstruction
  # target).  Native PE builds, no -m32 cross flags needed.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
          - arch: x86
            msystem: MINGW32
            prefix: mingw-w64-i686

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc
            make

      # GLAD_SERVERFIX=1 -- see the Linux job.
      - name: Build
        shell: msys2 {0}
        run: |
          make clean
          make GLAD_SERVERFIX=1

      - name: Create package
        shell: pwsh
        run: |
          # Asset version: derive from the tag (v0.96 -> 096); default 096
          # for untagged push/PR builds. See Mr. Elusive's gladq2096_* scheme.
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' -replace '\.','' } else { '096' }
          $pkg = "gladq2${ver}_windows-${{ matrix.arch }}"

          # Single flat "gladiator" mod folder: binaries + loose assets +
          # the bspc map compilers, all at top level. Only assets/default/ is
          # kept as a subfolder; assets/maps/ and the .map linker files are omitted.
          if (Test-Path gladiator) { Remove-Item gladiator -Recurse -Force }
          New-Item -ItemType Directory -Force -Path gladiator | Out-Null

          Copy-Item release\gladiator.dll  gladiator -ErrorAction SilentlyContinue
          Copy-Item release\game\game.dll  gladiator -ErrorAction SilentlyContinue

          Get-ChildItem assets -Force | Where-Object { $_.Name -ne 'maps' } | ForEach-Object {
            Copy-Item $_.FullName -Destination gladiator -Recurse -Force
          }
          # tools/: ship only the Win32 bspc compilers
          Copy-Item tools/vendor/bspc/bspc.exe,tools/vendor/bspc/winbspc.exe,tools/vendor/bspc/bspc.htm,tools/vendor/bspc/winbspc.htm -Destination gladiator -Force

          Compress-Archive -Path gladiator -DestinationPath "${pkg}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: gladq2*_windows-${{ matrix.arch }}.zip

  # ---------------------------------------------------------------------------
  # macOS — Intel x86_64 (macos-26-intel) and Apple Silicon arm64 (macos-26).
  # macOS has no 32-bit target (Apple dropped i386 in 10.15), so the two
  # 64-bit architectures are the macOS pair in the 6-build set.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26

    steps:
      - uses: actions/checkout@v5

      # GLAD_SERVERFIX=1 -- see the Linux job.
      - name: Build
        run: |
          make clean
          make GLAD_SERVERFIX=1

      - name: Create package
        run: |
          # Asset version: derive from the tag (v0.96 -> 096); default 096
          # for untagged push/PR builds. See Mr. Elusive's gladq2096_* scheme.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER=$(echo "${{ github.ref_name }}" | sed 's/^v//; s/\.//g')
          else
            VER=096
          fi
          PKG=gladq2${VER}_macos-${{ matrix.arch }}
          # Single flat "gladiator" mod folder: binaries + loose assets +
          # the bspc map compilers, all at top level. Only assets/default/ is
          # kept as a subfolder; assets/maps/ and the .map linker files are omitted.
          rm -rf gladiator
          mkdir -p gladiator
          cp release/gladiator.dylib gladiator/    2>/dev/null || true
          cp release/game/game.dylib gladiator/    2>/dev/null || true
          for f in assets/*; do
            [ "$f" = "assets/maps" ] && continue
            cp -r "$f" gladiator/
          done
          # tools/: no native macOS bspc compiler exists (the Win32 / Linux-x86
          # binaries don't run on macOS), so none is bundled.
          tar -czf "${PKG}.tar.gz" gladiator

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: gladq2*_macos-${{ matrix.arch }}.tar.gz

  # ---------------------------------------------------------------------------
  # Release — only on v* tags; gathers all 8 artifacts and publishes them.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          echo "Release assets:"
          echo "$files"

          # The per-release part is the ANNOTATED tag's message: what changed since the
          # previous release, written when the release is cut, as the body of the
          # "What's new" section (the heading is added here).  It is read through the
          # API, not from a checkout, because actions/checkout rewrites a tag it fetches
          # into a lightweight one.  A lightweight tag has no message, and publishing
          # without one would silently repeat the previous release's text, so it stops
          # the release instead; the builds stay available as artifacts.  Create tags as
          #   git tag -a --cleanup=verbatim -F whatsnew.md vX.Y.Z <commit>
          # (git's default cleanup would delete any line starting with '#').
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. The release notes come from an annotated tag's message: git tag -a --cleanup=verbatim -F whatsnew.md $TAG <commit>"
            exit 1
          fi
          gh api "repos/$GH_REPO/git/tags/${ref##* }" --jq .message \
            | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > whatsnew.md
          if ! grep -q '[^[:space:]]' whatsnew.md; then
            echo "::error::$TAG has an empty tag message."
            exit 1
          fi
          {
            printf "## What's new in %s\n\n" "$TAG"
            cat whatsnew.md
            printf '\n'
          } > notes.md

          # What every release carries: the build flag and the fixes it builds in.  Each
          # bullet ends in a hidden `<!-- fix: <id> -->` marker that
          # tools/check_deviations.py matches against the GLAD_SERVERFIX(<id>) tags in
          # the source, so a deviation added without a bullet here fails `make verify`.
          # GitHub appends the --generate-notes output (the compare link) after the body.
          cat >> notes.md <<'NOTES'
          ## About these binaries

          Built with `GLAD_SERVERFIX=1`. This project reconstructs Gladiator Bot v0.96
          from the 1999 binaries, so its default build reproduces the originals *with
          their bugs*. The ones below are fatal or wrong on a live server, and a release
          is for playing, so these binaries fix them:

          - `AAS_AASLinkEntity` overflowed a fixed 64-entry BSP traversal stack and
            smashed its own frame on densely subdivided custom maps. Now sized and
            bounds-checked as Quake III does it. <!-- fix: aas-linkstack-overflow -->
          - `AAS_UpdateAreaRoutingCache` read one entry past its travel-time table
            for an area with no reachabilities of its own, crashing on maps that have
            such an area. The start area now adds zero travel time, as in Quake III. <!-- fix: route-start-areatraveltimes -->
          - `BotUpdateEntityItems` re-linked a level item using a stale index, so a bot
            navigated to an item using some other item's bounding box. <!-- fix: bot-item-stale-iteminfo -->
          - `PS_ReadNumber` applied its `l`/`u` numeric-suffix guard asymmetrically, a
            C operator-precedence slip in the original. <!-- fix: script-lu-suffix-guard -->
          - `G_FreeEdict` left a client's CTF grapple pointer dangling when a mover
            crushed the grapple in flight, crashing on the next frame's pull. <!-- fix: ctf-grapple-stale-pointer -->
          - `T_Damage` used a missing attacker unchecked. A blocked `func_door`
            reverses and fires its targets with no activator, so a `target_explosion`
            (or a damaging `target_splash`) it set off crashed the damage code. A
            missing attacker is now the world, which is Quake III's own fix. <!-- fix: null-attacker-damage-path -->
          - `G_UseTargets` warned about that missing activator for delayed targets,
            then read it anyway to print the door's `message`, crashing on any such
            door that carries one. Now checked. <!-- fix: null-activator-usetargets -->
          - `monster_use`, the two trigger-spawned monster callbacks and
            `trigger_key_use` read the same missing activator when such a door targets
            a monster or a key trigger. Now checked; a monster spawned this way simply
            starts without an enemy. <!-- fix: null-activator-use-callbacks -->
          - Bots could snap their view to a random direction when a move found no route
            or when they left the ground in their goal area. `BotClearMoveResult` never
            cleared the move's direction and view angles, and five AI nodes aimed with
            whatever memory was left there. Both are now cleared. A bot with nowhere to
            move looks around, as Quake III's long-term-goal node does, and a bot swimming
            to a teleporter or elevator faces the way it swims. <!-- fix: moveresult-uninit-vectors -->
          - On 32-bit Windows, when a map's bot navigation file came from an `aasN.zip`
            archive but failed to load, the game's working folder was left switched to
            the mod's folder. Files opened afterwards by relative path, which is how a
            default Quake II setup finds them, were then looked for in the wrong place.
            The folder is now switched back first. <!-- fix: aaszip-cwd-leak -->
          - When a player joined into a client slot a bot was using, the game moved the
            bot to a free slot by copying its entity without taking it out of the world
            first. That corrupted the server's entity lists and crashed it moments later,
            and the moved bot also ended up sharing the new player's client data. The bot
            is now moved the way Quake II moves any entity, and keeps its own client
            data. <!-- fix: bot-move-edict-copy -->
          - A bot moved that way also kept its old slot number in the bot library, so its
            movement went to the slot it had left and it stood still from then on. It
            now takes its new slot's number. <!-- fix: bot-move-stale-clientnum -->

          Where Quake III later fixed the same code, the fix is its own correction —
          Mr. Elusive wrote both bot libraries — and where it has no counterpart, the
          fix is the smallest change that stops the fault; nothing else is invented
          here. Every deviation sits behind one build flag with the 1999 behaviour
          preserved beside it, so `make` still builds the faithful reconstruction.
          NOTES
          gh release create "$TAG" \
            $files \
            --title "Gladiator $TAG" \
            --notes-file notes.md \
            --generate-notes
