name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make zip

      - name: Build
        run: make clean && make

      - name: Create package
        run: |
          PKG=gladiator-linux-x64

          mkdir -p "$PKG"

          #
          # Copy generated binaries if they exist
          #
          find release -type f \( -name "*.so" -o -name "*.dll" \) \
            -exec cp --parents {} "$PKG" \; || true

          #
          # Runtime assets
          #
          cp -r assets "$PKG/"
          cp -r tools "$PKG/"

          tar -czf ${PKG}.tar.gz "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: gladiator-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        shell: msys2 {0}
        run: |
          make clean
          make

      - name: Create package
        shell: pwsh
        run: |
          $pkg = "gladiator-windows-x64"

          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          #
          # Built binaries
          #
          Copy-Item release\gladiator.dll $pkg -ErrorAction SilentlyContinue
          Copy-Item release\gladiator.map $pkg -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "$pkg\game" | Out-Null

          Copy-Item release\game\game.dll "$pkg\game" -ErrorAction SilentlyContinue
          Copy-Item release\game\game.map "$pkg\game" -ErrorAction SilentlyContinue

          #
          # Assets and tools
          #
          Copy-Item assets "$pkg" -Recurse
          Copy-Item tools "$pkg" -Recurse

          Compress-Archive `
            -Path "$pkg\*" `
            -DestinationPath "${pkg}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: gladiator-windows-x64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/linux-x64/gladiator-linux-x64.tar.gz \
            artifacts/windows-x64/gladiator-windows-x64.zip \
            --title "Gladiator ${{ github.ref_name }}" \
            --generate-notes